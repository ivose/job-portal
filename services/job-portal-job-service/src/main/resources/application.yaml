server:
  port: 5003

spring:
  application:
    name: job-portal-job-service

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  datasource:
    url: jdbc:postgresql://localhost:5432/yt_job_portal_job
    username: postgres
    password: secretpass # in real projects don't write straignt here, it's for local develop only
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

# if necessary:
# docker exec -it job-portal-postgres psql -U postgres -d postgres
