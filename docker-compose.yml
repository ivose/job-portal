services:
  postgres:
    image: postgres:16
    container_name: job-portal-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: yt_job_portal_user
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpass

    ports:
      - "127.0.0.1:5432:5432"
    # if the first time loading:
    # docker exec job-portal-postgres psql -U postgres -d postgres -c "CREATE DATABASE yt_job_portal_user;"
    # docker exec job-portal-postgres psql -U postgres -d postgres -c "CREATE DATABASE yt_job_portal_company;"
    # docker exec job-portal-postgres psql -U postgres -d postgres -c "CREATE DATABASE yt_job_portal_job;"
    # docker exec job-portal-postgres psql -U postgres -d postgres -c "CREATE DATABASE yt_job_portal_resume;"
    # docker exec job-portal-postgres psql -U postgres -d postgres -c "CREATE DATABASE yt_job_portal_application;"
    # before hard reloading:
    # docker exec job-portal-postgres psql -U postgres -d yt_job_portal_user -v ON_ERROR_STOP=1 -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
    # docker exec job-portal-postgres psql -U postgres -d yt_job_portal_company -v ON_ERROR_STOP=1 -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
    # docker exec job-portal-postgres psql -U postgres -d yt_job_portal_job -v ON_ERROR_STOP=1 -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
    # docker exec job-portal-postgres psql -U postgres -d yt_job_portal_resume -v ON_ERROR_STOP=1 -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
    # docker exec job-portal-postgres psql -U postgres -d yt_job_portal_application -v ON_ERROR_STOP=1 -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
    #if necessary,
    # docker exec -it job-portal-postgres psql -U postgres .
    # CREATE DATABASE yt_job_portal_company; ## the same for other databases
    # \l
    # \q


    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
