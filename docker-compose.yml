services:
  postgres:
    image: postgres:16
    container_name: job-portal-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: yt_job_portal_user
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpass

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: